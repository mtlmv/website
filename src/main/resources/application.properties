spring.application.name=website

# Локально ключи берутся из .env в корне проекта (он в git не попадает).
# На хостинге .env нет — там те же переменные задаются в панели, и строка ниже
# просто ничего не делает благодаря optional:
spring.config.import=optional:file:.env[.properties]

# Адрес собирается по частям: Render (и большинство хостингов) отдают host,
# port и имя базы отдельными переменными, а не готовой JDBC-строкой
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}${DB_PARAMS:}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SQL_LOGGING:true}
spring.jpa.properties.hibernate.format_sql=${SQL_LOGGING:true}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# По умолчанию Spring режет загрузку на 1 МБ. Запас в запросе — на текст
# комментария и служебные поля формы
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Хостинг назначает порт сам и передаёт его в PORT
server.port=${PORT:8081}
