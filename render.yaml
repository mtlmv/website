# Блюпринт НЕ создаёт базу: Render разрешает только одну бесплатную базу
# на аккаунт, и если она уже есть — весь деплой падает.
# Поэтому реквизиты базы вводятся при деплое (Render спросит их сам).
#
# Подойдёт любая из двух:
#   1. Уже существующая база на Render — возьмите её Internal Database URL
#   2. Внешняя, например Neon (neon.tech) — там бесплатная база не удаляется
#      через 30 дней; для неё задайте DB_PARAMS = ?sslmode=require

services:
  - type: web
    name: website
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Для Neon и других баз с обязательным SSL: ?sslmode=require
      # Для базы внутри Render можно оставить пустым
      - key: DB_PARAMS
        sync: false
      # Сгенерируется случайно при первом деплое и сохранится
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      # На сервере логировать каждый SQL-запрос незачем
      - key: SQL_LOGGING
        value: false
